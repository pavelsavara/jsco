name: browser-test-image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/docker/browser-tests/Dockerfile'
      - '.github/workflows/browser-test-image.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [ "main" ]
    paths:
      - '.github/docker/browser-tests/Dockerfile'
      - '.github/workflows/browser-test-image.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/pavelsavara/jsco-browser-tests
  IMAGE_TAG: playwright-1.59.1-node-24

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build browser-test image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .github/docker/browser-tests/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          ${{ env.IMAGE }}:${{ github.sha }}